# wasc passwords: universal macOS desktop build (DMG + zip + latest-mac.yml for electron-updater).
# Signs with a Developer ID certificate and notarizes when the secrets exist; otherwise produces an
# unsigned (ad-hoc signed) build that still runs after `xattr -dr com.apple.quarantine`.
# See wasc/README.md.
name: wasc desktop

on:
  push:
    branches: [wasc]
    paths:
      - "apps/desktop/**"
      - "libs/**"
      - "wasc/desktop/**"
      - "wasc/brand/**"
      - "package-lock.json"
      - ".github/workflows/wasc-desktop.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish GitHub release wasc-desktop-v<version> (Latest when signed, prerelease when unsigned)"
        type: boolean
        default: false
      version:
        description: "Version override X.Y.Z for fork-only fixes, e.g. 2026.10.1 (default: apps/desktop/src/package.json)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wasc-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS universal
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.version.outputs.signed }}
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' && secrets.MAC_CERT_PASSWORD != '' }}
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.2"

      - name: Set up Node-gyp
        run: python -m pip install setuptools

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: |
            apps/desktop/desktop_native -> target

      - name: Install Node dependencies
        working-directory: ./
        run: |
          npm ci
          # Same as upstream's OSS build: never ship the commercially licensed SDK.
          rm -rf node_modules/@bitwarden/commercial-sdk-internal

      - name: Read version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The packaged app takes its version from src/package.json (build/package.json).
          VERSION="${INPUT_VERSION:-$(node -p 'require("./src/package.json").version')}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected X.Y.Z)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "signed=$HAS_MAC_CERT" >> "$GITHUB_OUTPUT"

      - name: Build native modules (x64 + arm64)
        working-directory: apps/desktop/desktop_native
        run: node build.js cross-platform --release

      - name: Build application
        run: npm run build

      - name: Import Developer ID certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Prepend ours to the user search list (paths may contain spaces, hence NUL-separated).
          security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/' | tr '\n' '\0' \
            | xargs -0 security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # The SHA-1 hash works both for electron-builder (CSC_NAME) and for `codesign -s`
          # in scripts/after-pack.js (via scripts/macos-signing-identity.js).
          HASH=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$HASH" ]; then echo "No Developer ID Application identity in the p12"; exit 1; fi
          echo "CSC_NAME=$HASH" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Set up notarization key
        if: env.HAS_MAC_CERT == 'true' && env.HAS_ASC == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          {
            echo "APP_STORE_CONNECT_TEAM_ISSUER=$ASC_ISSUER_ID"
            echo "APP_STORE_CONNECT_AUTH_KEY_ID=$ASC_KEY_ID"
            echo "APP_STORE_CONNECT_AUTH_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Package (signed)
        if: env.HAS_MAC_CERT == 'true'
        env:
          APPLE_NOTARIZE: ${{ env.HAS_ASC == 'true' && 'true' || 'false' }}
          VERSION: ${{ steps.version.outputs.version }}
        # GITHUB_ACTIONS=false keeps scripts/macos-signing-identity.js from picking Bitwarden's
        # identity; it then uses CSC_NAME.
        run: |
          npm run clean:dist
          GITHUB_ACTIONS=false npx electron-builder --config ../../wasc/desktop/electron-builder.json \
            --mac --universal -p never -c.extraMetadata.version="$VERSION"

      - name: Package (unsigned)
        if: env.HAS_MAC_CERT != 'true'
        env:
          APPLE_NOTARIZE: "false"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VERSION: ${{ steps.version.outputs.version }}
        # Ad-hoc signature ("-") for the app (arm64 refuses to run unsigned code) and, via
        # CSC_NAME=-, for the proxy in after-pack. Not notarized: users must clear the quarantine flag.
        # No hardened runtime: its library validation makes dyld refuse to load Electron Framework,
        # because an ad-hoc signature has no Team ID. scripts/sign-macos.js only adds
        # `--options runtime` when electron-builder resolves hardenedRuntime=true.
        run: |
          echo "::warning::MAC_CERT_P12_BASE64/MAC_CERT_PASSWORD not set: building an unsigned, un-notarized app"
          npm run clean:dist
          GITHUB_ACTIONS=false CSC_NAME=- npx electron-builder --config ../../wasc/desktop/electron-builder.json \
            --mac --universal -p never -c.mac.identity=- -c.mac.hardenedRuntime=false \
            -c.extraMetadata.version="$VERSION"

      - name: Inspect output
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist
          APP="dist/mac-universal/wasc passwords.app"
          plutil -p "$APP/Contents/Info.plist" | grep -E '"CFBundle(Identifier|Name|DisplayName|ShortVersionString)"'
          lipo -archs "$APP/Contents/MacOS/wasc passwords"
          codesign --verify --deep --strict --verbose=2 "$APP"
          FRAMEWORK="$APP/Contents/Frameworks/Electron Framework.framework"
          for f in "$APP" "$FRAMEWORK"; do
            echo "== $f"
            codesign -dv --verbose=2 "$f" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier|Signature|CodeDirectory)" || true
          done
          BUNDLE_VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          if [ "$BUNDLE_VERSION" != "$VERSION" ]; then
            echo "::error::Bundle version $BUNDLE_VERSION != $VERSION"; exit 1
          fi
          grep -qx "version: $VERSION" dist/latest-mac.yml || { echo "::error::latest-mac.yml is not $VERSION"; cat dist/latest-mac.yml; exit 1; }
          if [ "$HAS_MAC_CERT" != true ]; then
            for f in "$APP" "$FRAMEWORK"; do
              if codesign -dv "$f" 2>&1 | grep -E "^CodeDirectory" | grep -q "runtime"; then
                echo "::error::$f has the hardened runtime flag in an ad-hoc build"; exit 1
              fi
            done
          fi

      - name: Launch check
        # Starts the packaged app for 15 seconds. dyld rejections (for example library validation
        # refusing Electron Framework: "different Team IDs") kill the process at startup.
        run: |
          set -uo pipefail
          BIN="dist/mac-universal/wasc passwords.app/Contents/MacOS/wasc passwords"
          LOG="$RUNNER_TEMP/launch.log"
          "$BIN" > "$LOG" 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then ALIVE=true; else ALIVE=false; fi
          kill "$PID" 2>/dev/null || true
          sleep 3
          pkill -9 -f "wasc passwords.app/Contents" || true
          echo "--- app output"; cat "$LOG"; echo "---"
          if grep -Eiq "dyld|team id|library not loaded|code signature" "$LOG"; then
            echo "::error::dyld / code signature error while launching the app"; exit 1
          fi
          if [ "$ALIVE" != true ]; then
            echo "::error::The app exited within 15 seconds"; exit 1
          fi
          echo "App stayed up for 15 seconds without dyld errors"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasc-passwords-desktop-${{ steps.version.outputs.version }}-mac
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error

      - name: Clean up keychain
        if: always() && env.CSC_KEYCHAIN != ''
        run: security delete-keychain "$CSC_KEYCHAIN" || true

  release:
    name: GitHub release
    needs: macos
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasc-passwords-desktop-${{ needs.macos.outputs.version }}-mac
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.macos.outputs.version }}
          TAG: wasc-desktop-v${{ needs.macos.outputs.version }}
          SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          set -euo pipefail
          # Own tag prefix: the fork also carries upstream's desktop-v* tags.
          ASSETS=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo none)
          if [ "$ASSETS" = none ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG exists without a release; delete it or use the version input"; exit 1
            fi
            if [ "$SIGNED" = true ]; then KIND="signed + notarized"; else KIND="UNSIGNED (ad-hoc), prerelease"; fi
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "wasc passwords desktop $VERSION" \
              --notes "macOS universal build ($KIND) from $GITHUB_SHA."
          elif [ "$ASSETS" != 0 ]; then
            echo "::error::Release $TAG already has $ASSETS assets. Ship fork-only fixes with the version input (e.g. ${VERSION%.*}.$(( ${VERSION##*.} + 1 )))."
            exit 1
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/*.dmg dist/*.zip dist/*.blockmap dist/*.yml
          if [ "$SIGNED" = true ]; then
            # electron-updater (GitHub provider) reads latest-mac.yml from the release marked Latest.
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            # Unsigned builds cannot auto-update and must never become the update feed.
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          fi
