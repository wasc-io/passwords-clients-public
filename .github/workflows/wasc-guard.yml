# wasc passwords: keep Actions in this fork limited to wasc-* workflows, and keep this workflow's
# schedule alive. See wasc/ci/workflow-guard.sh and wasc/README.md.
#
# GitHub disables scheduled workflows in public repos after 60 days without repository activity.
# The monthly run re-enables this workflow (the only scheduled wasc workflow) via the API, which
# resets that timer.
name: wasc guard

on:
  push:
    branches: [wasc]
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasc-guard
  cancel-in-progress: false

jobs:
  guard:
    name: Disable non-wasc workflows, keepalive
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out guard script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: wasc/ci

      - name: Run guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: wasc/ci/workflow-guard.sh wasc-guard.yml
